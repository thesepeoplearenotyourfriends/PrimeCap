name: Build PrimeCap APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platforms and helper build tools
        run: sdkmanager "platforms;android-37" "platforms;android-35" "build-tools;35.0.0"

      - name: Build performance APK
        run: ./gradlew assemblePerformance

      - name: Upload PrimeCap APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeCap-performance-APK
          path: app/build/outputs/apk/performance/app-performance.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/performance/app-performance.apk PrimeCap.apk

      - name: Publish moving release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-primecap >/dev/null 2>&1; then
            gh release create latest-primecap \
              --title "Latest PrimeCap build" \
              --notes "This release is automatically updated with the latest successful PrimeCap build."
          fi
          gh release upload latest-primecap PrimeCap.apk --clobber
          gh release edit latest-primecap --latest
