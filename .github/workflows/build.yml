name: Build PrimeCap APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Build development APK
        run: ./gradlew assembleDevelopment

      - name: Upload PrimeCap APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeCap-development-APK
          path: app/build/outputs/apk/development/app-development.apk
          if-no-files-found: error
