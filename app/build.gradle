plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.openrecorder.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.openrecorder.app'
        minSdk 29
        targetSdk 36
        versionCode 10001
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        performance {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        development {
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main.assets.srcDir("${projectDir}/scrcpy/build/assets")
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

tasks.register('buildPrimeCapHelper', Exec) {
    inputs.file("${projectDir}/scrcpy/scrcpy-3.3.4.tar.gz")
    inputs.file("${projectDir}/scrcpy/primecap-helper.patch")
    inputs.dir("${projectDir}/scrcpy/overlay")
    inputs.file("${projectDir}/scrcpy/build.sh")
    outputs.file("${projectDir}/scrcpy/build/assets/primecap-server")
    commandLine 'bash', "${projectDir}/scrcpy/build.sh"
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildPrimeCapHelper')
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.compose.ui:ui:1.11.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.11.1'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.3'
    testImplementation 'junit:junit:4.13.2'
}
