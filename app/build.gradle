plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.openrecorder.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.openrecorder.app'
        minSdk 29
        targetSdk 36
        versionCode 10001
        versionName '1.0.1'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        performance {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        development {
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main.assets.srcDir("${projectDir}/scrcpy/build/assets")
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

tasks.register('buildPrimeCapVideoDaemon', Exec) {
    inputs.file("${projectDir}/scrcpy/scrcpy-3.3.4.tar.gz")
    inputs.file("${projectDir}/scrcpy/primecap-daemon.patch")
    inputs.dir("${projectDir}/scrcpy/overlay")
    inputs.file("${projectDir}/scrcpy/build.sh")
    outputs.file("${projectDir}/scrcpy/build/primecap-video-daemon")
    outputs.file("${projectDir}/scrcpy/build/assets/primecap-relay")
    commandLine 'bash', "${projectDir}/scrcpy/build.sh"
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildPrimeCapVideoDaemon')
}

// The launcher executable must exist before AGP snapshots the generated asset directory.
tasks.configureEach { task ->
    if (task.name ==~ /merge(Debug|Release|Performance|Development)Assets/) {
        def variant = task.name.substring('merge'.length(),
                task.name.length() - 'Assets'.length())
        task.dependsOn("externalNativeBuild${variant}")
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.compose.ui:ui:1.11.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.11.1'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.3'
    testImplementation 'junit:junit:4.13.2'
}
